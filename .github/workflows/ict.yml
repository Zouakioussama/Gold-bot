name: ICT bot

on:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ict-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one cycle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.ICT_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATE_FILE: ict_state.json
          COOLDOWN_HOURS: "2"
        run: python ict_bot.py --cycle
      - name: Save state
        run: |
          if [ -f ict_state.json ] && [ -n "$(git status --porcelain ict_state.json)" ]; then
            git config user.name "ict-bot"
            git config user.email "ict-bot@users.noreply.github.com"
            git add ict_state.json
            git commit -m "update ict state"
            git pull --rebase
            git push
          fi
